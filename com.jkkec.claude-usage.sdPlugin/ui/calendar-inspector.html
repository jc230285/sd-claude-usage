<!DOCTYPE html>
<html><head><meta charset="utf-8"/><title>Calendar Agenda</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#2d2d2d;color:#ccc;margin:0;padding:8px}.wrap{padding:4px 16px}.item{display:flex;align-items:center;margin:10px 0;gap:8px}.label{width:92px;font-size:12px;color:#aaa}select{flex:1;min-width:0;background:#3b3b3b;color:#eee;border:1px solid #555;border-radius:3px;padding:6px;font-size:12px}.hint{font-size:11px;color:#888;line-height:1.35;margin:10px 0 0 100px}
</style></head><body><div class="wrap">
<div class="item"><div class="label">Display</div><select id="calendarView">
<option value="auto">Auto rotate all 4</option>
<option value="my_next">My current / next</option>
<option value="my_following">My following</option>
<option value="team_next">Colleague current / next</option>
<option value="team_following">Colleague following</option>
</select></div>
<div class="hint">Auto rotates every 5 seconds. Fixed views stay on the selected slot. Countdown is shown only below 100 minutes; otherwise the meeting start/end clock time is shown.</div>
</div><script>
let ws=null,uuid=null,settings={};
function connectElgatoStreamDeckSocket(port,piUuid,registerEvent,info,actionInfo){uuid=piUuid;const ai=JSON.parse(actionInfo);settings=ai.payload.settings||{};const el=document.getElementById('calendarView');el.value=settings.calendarView||'auto';el.addEventListener('change',save);ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>ws.send(JSON.stringify({event:registerEvent,uuid:piUuid}));}
function save(){settings.calendarView=document.getElementById('calendarView').value;if(ws&&ws.readyState===1)ws.send(JSON.stringify({event:'setSettings',context:uuid,payload:settings}));}
</script></body></html>
